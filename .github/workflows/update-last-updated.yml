name: Update last-updated footers

on:
  push:
    branches: [main]
    paths:
      - "**.html"

permissions:
  contents: write

concurrency:
  group: last-updated-footers
  cancel-in-progress: false

jobs:
  update:
    # Never react to the footer commit this job pushes itself.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect HTML files changed in this push
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/changed-html.txt"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$BEFORE" HEAD -- '*.html' > "$list"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- '*.html' > "$list"
          else
            git ls-files '*.html' > "$list"
          fi
          echo "Changed HTML files:"
          cat "$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          if [ -s "$list" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi

      - name: Rewrite footer dates
        if: steps.changed.outputs.any == 'true'
        env:
          LIST: ${{ steps.changed.outputs.list }}
        run: |
          set -euo pipefail
          xargs -d '\n' -a "$LIST" node scripts/update-last-updated.mjs

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No footer dates needed updating."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh last-updated footers [skip ci]"
          git push
